<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArcadeVerse - Choose Your Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: manipulation;
        }
        
        /* NEW: Added max-width and max-height to scale properly on mobile */
        canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            max-width: 95vw;  /* Prevents horizontal overflow */
            max-height: 60vh; /* Leaves room for buttons at the bottom */
            object-fit: contain;
        }

        .controls-container {
            display: none;
            margin-top: 15px;
            text-align: center;
        }
        .control-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 5px 0;
        }
        .ctrl-btn {
            background: #333;
            color: #fff;
            border: 2px solid #555;
            padding: 15px 25px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            background: #555;
        }
    </style>
</head>
<body>
<a href="index.html" style="position: absolute; top: 15px; left: 15px; color: white; font-weight: bold; text-decoration: none; font-size: 14px; background: #ef4444; padding: 6px 12px; border-radius: 4px; font-family: sans-serif; z-index: 100;">⬅ Arena Hub</a>
<canvas id="gameCanvas" width="800" height="400"></canvas>

<!-- On-screen directional buttons for Snake Game -->
<div id="snakeControls" class="controls-container">
    <div class="control-row">
        <button class="ctrl-btn" id="btnUp">▲</button>
    </div>
    <div class="control-row">
        <button class="ctrl-btn" id="btnLeft">◀</button>
        <button class="ctrl-btn" id="btnDown">▼</button>
        <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const snakeControls = document.getElementById("snakeControls");

    // Web Audio API Setup for Sound Effects
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'score') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'jump') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'eat') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        } catch (e) {}
    }

    let gameState = 'menu';
    let score = 0;
    let highScore = 0;
    let gameSpeed = 5;

    // Player for Dino Runner Game
    const player = {
        x: 50,
        y: 280,
        width: 50,
        height: 60,
        vy: 0,
        gravity: 0.8,
        jumpPower: -13,
        isGrounded: true
    };

    let obstacle = {
        x: 800,
        y: 295,
        width: 35,
        height: 45,
        speed: 6
    };

    // Snake Game Variables
    const gridSize = 20;
    let snake = [];
    let dx = gridSize;
    let dy = 0;
    let food = { x: 0, y: 0 };
    let snakeTimer = 0;
    const snakeSpeedThreshold = 7;

    function resetSnakeGame() {
        snake = [
            { x: 160, y: 200 },
            { x: 140, y: 200 },
            { x: 120, y: 200 }
        ];
        dx = gridSize;
        dy = 0;
        score = 0;
        spawnFood();
    }

    function spawnFood() {
        food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
        food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
    }

    let mountains = [
        { x: 0, y: 180, width: 400, height: 150, speed: 1 },
        { x: 350, y: 160, width: 450, height: 170, speed: 1 },
        { x: 750, y: 180, width: 400, height: 150, speed: 1 }
    ];

    function changeSnakeDirection(newDx, newDy) {
        if (newDx === -gridSize && dx === 0) { dx = -gridSize; dy = 0; }
        else if (newDx === gridSize && dx === 0) { dx = gridSize; dy = 0; }
        else if (newDy === -gridSize && dy === 0) { dx = 0; dy = -gridSize; }
        else if (newDy === gridSize && dy === 0) { dx = 0; dy = gridSize; }
    }

    document.getElementById("btnUp").addEventListener("click", () => { initAudio(); if(gameState==='snake_playing') changeSnakeDirection(0, -gridSize); });
    document.getElementById("btnDown").addEventListener("click", () => { initAudio(); if(gameState==='snake_playing') changeSnakeDirection(0, gridSize); });
    document.getElementById("btnLeft").addEventListener("click", () => { initAudio(); if(gameState==='snake_playing') changeSnakeDirection(-gridSize, 0); });
    document.getElementById("btnRight").addEventListener("click", () => { initAudio(); if(gameState==='snake_playing') changeSnakeDirection(gridSize, 0); });

    // NEW: Updated Click Event to handle Mobile Scaling Accurately
    canvas.addEventListener("click", function(e) {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        
        // Calculate the scale factor between the actual canvas size and the CSS scaled size
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        // Apply scale factor to mouse/tap coordinates
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;

        if (gameState === 'menu') {
            // Click Dino Game Button
            if (mouseX >= 180 && mouseX <= 380 && mouseY >= 220 && mouseY <= 280) {
                score = 0;
                gameSpeed = 5;
                obstacle.x = 800;
                obstacle.speed = 6;
                player.y = 280;
                player.vy = 0;
                player.isGrounded = true;
                snakeControls.style.display = "none";
                gameState = 'dino_playing';
            }
            // Click Classic Snake Game Button
            if (mouseX >= 420 && mouseX <= 620 && mouseY >= 220 && mouseY <= 280) {
                resetSnakeGame();
                snakeControls.style.display = "block";
                gameState = 'snake_playing';
            }
        } else if (gameState === 'dino_playing') {
            if (player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
                playSound('jump');
            }
        } else if (gameState === 'gameover') {
            snakeControls.style.display = "none";
            gameState = 'menu';
        }
    });

    window.addEventListener("keydown", function(e) {
        initAudio();
        if (gameState === 'dino_playing') {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                if (player.isGrounded) {
                    player.vy = player.jumpPower;
                    player.isGrounded = false;
                    playSound('jump');
                }
            }
        } else if (gameState === 'snake_playing') {
            if (e.code === "ArrowLeft" || e.code === "KeyA") {
                changeSnakeDirection(-gridSize, 0); e.preventDefault();
            } else if (e.code === "ArrowRight" || e.code === "KeyD") {
                changeSnakeDirection(gridSize, 0); e.preventDefault();
            } else if (e.code === "ArrowUp" || e.code === "KeyW") {
                changeSnakeDirection(0, -gridSize); e.preventDefault();
            } else if (e.code === "ArrowDown" || e.code === "KeyS") {
                changeSnakeDirection(0, gridSize); e.preventDefault();
            }
        } else if (gameState === 'gameover') {
            if (e.code === "Space" || e.code === "Enter") {
                snakeControls.style.display = "none";
                gameState = 'menu';
            }
        }
    });

    function drawMountainBackground() {
        ctx.fillStyle = "#4A708B";
        mountains.forEach(m => {
            ctx.beginPath();
            ctx.moveTo(m.x, 330);
            ctx.lineTo(m.x + m.width / 2, m.y);
            ctx.lineTo(m.x + m.width, 330);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath();
            ctx.moveTo(m.x + m.width / 2, m.y);
            ctx.lineTo(m.x + m.width / 2 - 25, m.y + 40);
            ctx.lineTo(m.x + m.width / 2 + 25, m.y + 40);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#4A708B";

            m.x -= m.speed;
            if (m.x + m.width < 0) {
                m.x = canvas.width;
            }
        });

        ctx.fillStyle = "#2E8B57";
        ctx.fillRect(0, 330, canvas.width, 70);
        ctx.fillStyle = "#32CD32";
        ctx.fillRect(0, 330, canvas.width, 6);
    }

    function drawSnakeGridBackground() {
        for (let x = 0; x < canvas.width; x += gridSize) {
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.fillStyle = "#32CD32";
                ctx.fillRect(x + 1, y + 1, gridSize - 2, gridSize - 2);
                ctx.fillStyle = "#228B22";
                ctx.strokeRect(x + 1, y + 1, gridSize - 2, gridSize - 2);
            }
        }
    }

    function drawPlayer() {
        const px = player.x;
        const py = player.y;

        ctx.fillStyle = "#7CCD7C";
        ctx.fillRect(px + 10, py + 15, 30, 35);
        ctx.fillRect(px + 8, py, 34, 20);

        ctx.fillStyle = "#000000";
        ctx.fillRect(px + 16, py + 6, 4, 4);
        ctx.fillRect(px + 28, py + 6, 4, 4);

        ctx.fillRect(px + 12, py + 50, 8, 10);
        ctx.fillRect(px + 26, py + 50, 8, 10);

        ctx.fillStyle = "#8B4513";
        ctx.fillRect(px + 40, py + 25, 4, 12);
        ctx.fillStyle = "#DAA520";
        ctx.fillRect(px + 37, py + 24, 10, 3);
        ctx.fillStyle = "#E0E0E0";
        ctx.fillRect(px + 41, py + 5, 2, 21);
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(px + 41, py + 5, 1, 21);
    }

    function drawDinoObstacle() {
        const ox = obstacle.x;
        const oy = obstacle.y;

        ctx.fillStyle = "#555555";
        ctx.fillRect(ox + 8, oy + 15, 22, 25);
        ctx.fillRect(ox + 20, oy + 2, 14, 15);
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(ox + 28, oy + 5, 3, 3);
        ctx.fillStyle = "#555555";
        ctx.fillRect(ox + 10, oy + 40, 5, 5);
        ctx.fillRect(ox + 22, oy + 40, 5, 5);
        ctx.beginPath();
        ctx.moveTo(ox + 8, oy + 20);
        ctx.lineTo(ox, oy + 15);
        ctx.lineTo(ox + 8, oy + 30);
        ctx.fill();
    }

    function update() {
        if (gameState === 'dino_playing') {
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y >= 280) {
                player.y = 280;
                player.vy = 0;
                player.isGrounded = true;
            }

            obstacle.x -= obstacle.speed;
            if (obstacle.x < -50) {
                obstacle.x = canvas.width + Math.random() * 100;
                score += 10;
                playSound('score');
                if (score > highScore) highScore = score;
                if (score % 50 === 0) {
                    obstacle.speed += 0.5;
                }
            }

            if (
                player.x < obstacle.x + obstacle.width - 8 &&
                player.x + player.width - 8 > obstacle.x &&
                player.y < obstacle.y + obstacle.height &&
                player.y + player.height > obstacle.y
            ) {
                snakeControls.style.display = "none";
                gameState = 'gameover';
                playSound('gameover');
            }
        } else if (gameState === 'snake_playing') {
            snakeTimer++;
            if (snakeTimer >= snakeSpeedThreshold) {
                snakeTimer = 0;

                const head = { x: snake[0].x + dx, y: snake[0].y + dy };

                if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                    snakeControls.style.display = "none";
                    gameState = 'gameover';
                    playSound('gameover');
                    return;
                }

                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        snakeControls.style.display = "none";
                        gameState = 'gameover';
                        playSound('gameover');
                        return;
                    }
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    playSound('eat');
                    if (score > highScore) highScore = score;
                    spawnFood();
                } else {
                    snake.pop();
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'snake_playing') {
            drawSnakeGridBackground();
        } else {
            drawMountainBackground();
        }

        if (gameState === 'menu') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 32px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText("CHOOSE YOUR GAME MODE", canvas.width / 2, 130);

            // Dino Button
            ctx.fillStyle = "#2E8B57";
            ctx.fillRect(180, 210, 200, 60);
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 20px 'Courier New'";
            ctx.fillText("DINO RUNNER", 280, 246);

            // Snake Game Button
            ctx.fillStyle = "#CD5C5C";
            ctx.fillRect(420, 210, 200, 60);
            ctx.fillStyle = "#FFFFFF";
            ctx.fillText("CLASSIC SNAKE", 520, 246);

            ctx.textAlign = "left";
        } else if (gameState === 'dino_playing') {
            drawPlayer();
            drawDinoObstacle();

            ctx.fillStyle = "#333333";
            ctx.font = "bold 18px 'Courier New'";
            ctx.fillText("SCORE: " + score, 30, 40);
            ctx.fillText("HI: " + highScore, 680, 40);
        } else if (gameState === 'snake_playing') {
            ctx.fillStyle = "#FF0000";
            ctx.fillRect(food.x + 2, food.y + 2, gridSize - 4, gridSize - 4);
            ctx.strokeStyle = "#800000";
            ctx.strokeRect(food.x + 2, food.y + 2, gridSize - 4, gridSize - 4);

            snake.forEach((part, index) => {
                ctx.fillStyle = "#000000";
                ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
                ctx.strokeStyle = "#C0C0C0";
                ctx.strokeRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
            });

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 18px 'Courier New'";
            ctx.fillText("SCORE: " + score, 30, 30);
            ctx.fillText("HI: " + highScore, 680, 30);
        }

        if (gameState === 'gameover') {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 32px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 40);

            ctx.font = "20px 'Courier New'";
            ctx.fillText("Score: " + score + "   |   High Score: " + highScore, canvas.width / 2, canvas.height / 2);

            ctx.font = "16px 'Courier New'";
            ctx.fillStyle = "#FFD700";
            ctx.fillText("Tap or Press Space to return", canvas.width / 2, canvas.height / 2 + 45);
            ctx.textAlign = "left";
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
