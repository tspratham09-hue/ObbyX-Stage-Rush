<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPlay Arena</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 42px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 16px;
            color: #94a3b8;
        }

        .game-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }

        .game-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            width: 300px;
            padding: 30px 20px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: #38bdf8;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e2e8f0;
        }

        p.desc {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .play-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .game-card:hover .play-btn {
            background: #3b82f6;
        }
    </style>
</head>
<body>

    <header>
        <h1>PixelPlay Arena</h1>
        <p class="subtitle">Select a game to start playing</p>
    </header>

    <div class="game-grid">
        <!-- Obby Stage Rush Card -->
        <a href="obby.html" class="game-card">
            <div class="icon">🏃‍♂️</div>
            <h2>Obby Stage Rush</h2>
            <p class="desc">Jump, dash, and survive the ultimate obstacle course. Collect coins and upgrade your character!</p>
            <button class="play-btn">Play Now</button>
        </a>

        <!-- Arcade Classics Card -->
        <a href="arcade.html" class="game-card">
            <div class="icon">🦖</div>
            <h2>Arcade Classics</h2>
            <p class="desc">Enjoy two retro favorites! Test your reflexes in Dino Runner or master the Classic Snake game.</p>
            <button class="play-btn">Play Now</button>
        </a>
    </div>

</body>
</html>
