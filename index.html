<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obby Stage Rush - 15 Stages</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: white; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { position: relative; width: 100vw; height: 100vh; max-width: 960px; max-height: 540px; background: #000; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; pointer-events: none; }
        .ui-box { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; pointer-events: auto; }
        #top-left h2 { font-size: 18px; color: #f8fafc; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        #top-left p { font-size: 12px; color: #94a3b8; margin-top: 5px; }
        #top-center { font-size: 20px; font-weight: bold; color: #38bdf8; text-align: center; text-shadow: 0 0 8px rgba(56,189,248,0.6); }
        #top-right { text-align: right; }
        #top-right p { font-size: 16px; margin-bottom: 5px; font-weight: bold; }
        
        /* Buttons */
        .btn-row { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; pointer-events: auto; }
        .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; border-bottom: 4px solid #1d4ed8; transition: transform 0.1s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .action-btn:active { transform: translateY(4px); border-bottom: 0px; margin-top: 4px; box-shadow: none; }
        .action-btn.shop { background: #f59e0b; border-color: #b45309; }

        /* Modals */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 100; pointer-events: auto; }
        .hidden { display: none !important; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; text-align: center; border: 2px solid #475569; position: relative; max-height: 90%; overflow-y: auto; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .modal-content h1 { margin-bottom: 20px; color: #f8fafc; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: #ef4444; border: none; color: white; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* Shop Grid */
        #shop-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .shop-card { background: #334155; padding: 15px; border-radius: 8px; text-align: center; border: 2px solid transparent; transition: 0.2s; }
        .shop-card.selected { border-color: #22c55e; background: #064e3b; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .shop-card h4 { margin-bottom: 5px; color: #f8fafc; }
        .shop-card p { font-size: 14px; color: #cbd5e1; margin-bottom: 10px; }
        .shop-card button { margin-top: 5px; width: 100%; padding: 8px; border: none; border-radius: 4px; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .shop-card button:hover:not(:disabled) { background: #2563eb; }
        .shop-card button:disabled { background: #64748b; cursor: not-allowed; }

        /* Mobile Controls */
        #mobile-controls { position: absolute; bottom: 20px; left: 20px; width: calc(100% - 40px); display: none; justify-content: space-between; pointer-events: none; }
        .d-pad { display: flex; gap: 10px; pointer-events: auto; }
        .control-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; color: white; font-size: 24px; font-weight: bold; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .control-btn:active { background: rgba(255,255,255,0.3); }
        .action-pad { pointer-events: auto; }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            .btn-row { top: 20px; bottom: auto; right: 20px; }
            #ui-layer { display: none; } 
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div class="ui-box" id="top-left">
            <h2 id="level-title">Stage 1 / 15</h2>
            <p id="theme-name">Theme: Neon Synthwave</p>
        </div>
        <div class="ui-box" id="top-center">
            <span id="timer-display">⏱️ 00:00</span>
        </div>
        <div class="ui-box" id="top-right">
            <p id="coin-counter">🪙 0</p>
            <p id="death-counter">☠️ 0</p>
        </div>
    </div>
    <div class="btn-row"><button class="action-btn shop" id="open-shop-btn">🛒 Shop</button></div>
    <div id="mobile-controls">
        <div class="d-pad"><div class="control-btn" id="btn-left">◄</div><div class="control-btn" id="btn-right">►</div></div>
        <div class="action-pad"><div class="control-btn" id="btn-jump">▲</div></div>
    </div>
    <div id="shop-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" id="close-shop-btn">X</button>
            <h1>Character Shop</h1>
            <p style="margin-bottom: 20px; color: #cbd5e1;">Use coins found in levels to unlock new styles!</p>
            <div id="shop-items"></div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 960; canvas.height = 540;

const levelTitleUI = document.getElementById('level-title');
const coinCounterUI = document.getElementById('coin-counter');
const deathCounterUI = document.getElementById('death-counter');
const themeNameUI = document.getElementById('theme-name');
const shopModal = document.getElementById('shop-modal');
const openShopBtn = document.getElementById('open-shop-btn');
const closeShopBtn = document.getElementById('close-shop-btn');
const shopItemsContainer = document.getElementById('shop-items');

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

const SKINS = [
    { id: 'king', name: 'King', cost: 0, color: '#fde047', dark: '#ca8a04', type: 'king' },
    { id: 'knight', name: 'Knight', cost: 10, color: '#84cc16', dark: '#4d7c0f', type: 'knight' },
    { id: 'wizard', name: 'Wizard', cost: 25, color: '#3b82f6', dark: '#1d4ed8', type: 'wizard' },
    { id: 'ninja', name: 'Ninja', cost: 50, color: '#a855f7', dark: '#7e22ce', type: 'ninja' }
];

let unlockedSkins = ['king']; let equippedSkin = SKINS[0];
let coins = 0; let currentLevel = 1; let deaths = 0; let isPaused = false;

const player = {
    x: 50, y: 350, width: 28, height: 38,
    vx: 0, vy: 0, jumpForce: -11.5, 
    grounded: false, jumpsLeft: 2, maxJumps: 2, 
    facingRight: true, scaleX: 1, scaleY: 1, currentFriction: 0.82
};
const GRAVITY = 0.55; 
const BASE_FRICTION = 0.82; 
const ICE_FRICTION = 0.97; 

let checkpoint = { x: 50, y: 350 };
let keys = {};
let platforms = []; let lavas = []; let bouncePads = []; let coinsList = []; let checkpointsList = []; let particles = []; 
let movingPlatforms = []; let fragilePlatforms = []; let conveyors = [];
let exitDoor = { x: 880, y: 300, w: 45, h: 65 };
let cameraX = 0; let bgTimer = 0; 
let bgScenery = []; 

const THEMES = [
    { id: 'neon', name: "1. Neon Synthwave", sky: ["#0f0c29", "#302b63", "#24243e"], platform: "#0ea5e9", base: "#0284c7", danger: "#dc2626" }, 
    { id: 'lava', name: "2. Volcano Core", sky: ["#2a0800", "#5c1000", "#1f0400"], platform: "#27272a", base: "#18181b", danger: "#ea580c" },
    { id: 'toxic', name: "3. Toxic Crumble", sky: ["#022c22", "#064e3b", "#065f46"], platform: "#4ade80", base: "#166534", danger: "#84cc16" },
    { id: 'ice', name: "4. Slippery Slopes", sky: ["#082f49", "#0c4a6e", "#0284c7"], platform: "#bae6fd", base: "#38bdf8", danger: "#000000" },
    { id: 'cyber', name: "5. The Factory", sky: ["#2e1065", "#4c1d95", "#3b0764"], platform: "#94a3b8", base: "#475569", danger: "#d946ef" },
    { id: 'bounce', name: "6. Trampoline Park", sky: ["#4a044e", "#701a75", "#831843"], platform: "#f472b6", base: "#db2777", danger: "#e11d48" },
    { id: 'elevator', name: "7. Elevator Shaft", sky: ["#171717", "#262626", "#404040"], platform: "#fbbf24", base: "#d97706", danger: "#dc2626" },
    { id: 'treadmill', name: "8. The Treadmill", sky: ["#1e3a8a", "#1e40af", "#1d4ed8"], platform: "#64748b", base: "#475569", danger: "#ef4444" },
    { id: 'faith', name: "9. Leap of Faith", sky: ["#000000", "#111827", "#1f2937"], platform: "#34d399", base: "#059669", danger: "#b91c1c" },
    { id: 'ocean', name: "10. Boiling Ocean", sky: ["#7f1d1d", "#991b1b", "#b91c1c"], platform: "#14b8a6", base: "#0f766e", danger: "#f97316" },
    { id: 'stairs', name: "11. Fragile Stairs", sky: ["#14532d", "#166534", "#15803d"], platform: "#a3e635", base: "#65a30d", danger: "#b91c1c" },
    { id: 'chaos', name: "12. Conveyor Chaos", sky: ["#312e81", "#3730a3", "#4338ca"], platform: "#c084fc", base: "#9333ea", danger: "#fb923c" },
    { id: 'icesky', name: "13. Ice Skyscraper", sky: ["#0c4a6e", "#0369a1", "#0284c7"], platform: "#e0f2fe", base: "#7dd3fc", danger: "#1e1b4b" },
    { id: 'gauntlet', name: "14. The Gauntlet", sky: ["#27272a", "#3f3f46", "#52525b"], platform: "#f87171", base: "#dc2626", danger: "#991b1b" },
    { id: 'victory', name: "15. Victory Road", sky: ["#422006", "#713f12", "#a16207"], platform: "#fef08a", base: "#eab308", danger: "#ffffff" }
];
let currentTheme = THEMES[0];

function loadProgress() {
    coins = parseInt(localStorage.getItem('obby_coins') || '0');
    unlockedSkins = JSON.parse(localStorage.getItem('obby_skins') || '["king"]');
    equippedSkin = SKINS.find(s => s.id === (localStorage.getItem('obby_equippedSkin') || 'king')) || SKINS[0];
}
function saveProgress() {
    localStorage.setItem('obby_coins', coins.toString());
    localStorage.setItem('obby_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('obby_equippedSkin', equippedSkin.id);
}

function drawAdvancedCharacter(context, x, y, skin, facingRight, scaleX, scaleY) {
    context.save();
    context.translate(x, y); context.scale(facingRight ? scaleX : -scaleX, scaleY);
    context.fillStyle = skin.color; context.fillRect(-8, -38, 16, 12); context.fillRect(-14, -26, 28, 9); context.fillRect(-7, -17, 14, 17);
    context.fillStyle = skin.dark; context.fillRect(4, -38, 4, 12); context.fillRect(9, -26, 5, 9);
    context.fillStyle = '#000000'; context.fillRect(-4, -34, 3, 3); context.fillRect(2, -34, 3, 3);
    context.fillStyle = skin.color; context.fillRect(-10, -42, 20, 6);
    context.restore();
}

openShopBtn.onclick = () => { isPaused = true; shopModal.classList.remove('hidden'); renderShop(); };
closeShopBtn.onclick = () => { isPaused = false; shopModal.classList.add('hidden'); };

function renderShop() {
    shopItemsContainer.innerHTML = '';
    SKINS.forEach(skin => {
        const isUnlocked = unlockedSkins.includes(skin.id);
        const isEquipped = equippedSkin.id === skin.id;
        const card = document.createElement('div');
        card.className = `shop-card ${isEquipped ? 'selected' : ''}`;
        card.innerHTML = `<h4>${skin.name}</h4><canvas id="preview-${skin.id}" width="60" height="70" style="margin: 0 auto; display: block;"></canvas><p>${isUnlocked ? 'Owned' : '🪙 ' + skin.cost}</p><button ${isEquipped ? 'disabled' : ''}>${isEquipped ? 'Equipped' : isUnlocked ? 'Equip' : 'Buy'}</button>`;
        card.querySelector('button').onclick = () => {
            if (isUnlocked) equippedSkin = skin;
            else if (coins >= skin.cost) { coins -= skin.cost; unlockedSkins.push(skin.id); equippedSkin = skin; }
            saveProgress(); renderShop();
        };
        shopItemsContainer.appendChild(card);
    });
    SKINS.forEach(skin => { const ctx = document.getElementById(`preview-${skin.id}`)?.getContext('2d'); if(ctx) drawAdvancedCharacter(ctx, 30, 60, skin, true, 1.2, 1.2); });
    coinCounterUI.innerText = `🪙 ${coins}`;
}

function spawnParticles(x, y, color, count, speed) {
    for(let i=0; i<count; i++) particles.push({ x, y, vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed - 2, life: 1, color, size: Math.random()*4 + 2 });
}

function generateBackgroundScenery() {
    bgScenery = [];
    for(let i = 0; i < 20; i++) {
        bgScenery.push({ x: Math.random() * 3000, y: canvas.height - (Math.random() * 200 + 100), w: Math.random() * 150 + 100, h: Math.random() * 300 + 150, speed: Math.random() * 0.3 + 0.1 });
    }
}

// 15 STAGES
function loadLevel(levelNum) {
    platforms = []; lavas = []; bouncePads = []; coinsList = []; checkpointsList = []; particles = []; movingPlatforms = []; fragilePlatforms = []; conveyors = [];
    checkpoint = { x: 50, y: 350 };
    player.x = checkpoint.x; player.y = checkpoint.y; player.vx = 0; player.vy = 0; cameraX = 0; bgTimer = 0;
    
    currentTheme = THEMES[(levelNum - 1) % THEMES.length];
    levelTitleUI.innerText = `Stage ${levelNum} / 15`;
    themeNameUI.innerText = `${currentTheme.name}`;
    generateBackgroundScenery();

    const addP = (x, y, w, h, isIce=false) => platforms.push({ x, y, w, h, isIce });
    const addL = (x, y, w, h) => lavas.push({ x, y, w, h });
    const addB = (x, y, w) => bouncePads.push({ x, y, w, h: 15 });
    const addC = (x, y) => checkpointsList.push({ x, y, w: 20, h: 30, reached: false });
    const addCoin = (x, y) => coinsList.push({ x, y, collected: false });
    const addMP = (x, y, w, h, vx, vy, range) => movingPlatforms.push({ x, y, w, h, vx, vy, range, traveled: 0 });
    const addFP = (x, y, w) => fragilePlatforms.push({ x, y, w, h: 15, active: true, timer: 60, respawnTimer: 0 });
    const addConv = (x, y, w, speed) => conveyors.push({ x, y, w, h: 15, speed });

    if(levelNum === 1) { // Neon Synthwave
        addP(20, 400, 160, 200); addP(300, 400, 160, 200); addP(600, 400, 100, 200); addB(625, 385, 50); 
        addP(800, 150, 100, 400); addC(830, 120); addCoin(950, 80); addP(1100, 350, 150, 200); exitDoor = { x: 1150, y: 285, w: 45, h: 65 };
    } 
    else if(levelNum === 2) { // Volcano Core
        addP(20, 400, 120, 200); addL(140, 450, 500, 150); addP(200, 350, 60, 20); addP(350, 300, 60, 20); addP(500, 350, 60, 20); 
        addP(640, 400, 100, 200); addC(660, 370); addL(740, 450, 300, 150); addP(850, 300, 60, 20); addCoin(865, 250);
        addP(1040, 400, 150, 200); exitDoor = { x: 1090, y: 335, w: 45, h: 65 };
    } 
    else if(levelNum === 3) { // Toxic Crumble
        addP(20, 400, 120, 200); addL(140, 450, 650, 150); addFP(200, 350, 60); addFP(320, 300, 60); addFP(440, 250, 60); 
        addP(560, 250, 80, 300); addC(580, 220); addMP(700, 250, 80, 20, 1.5, -0.5, 250); addCoin(900, 100);
        addP(1000, 150, 150, 400); exitDoor = { x: 1050, y: 85, w: 45, h: 65 };
    } 
    else if(levelNum === 4) { // Slippery Slopes
        addP(20, 400, 120, 200); addP(200, 400, 200, 200, true); addP(450, 350, 150, 200, true); addL(600, 450, 300, 150); 
        addP(700, 250, 80, 20, true); addCoin(725, 200); addP(900, 400, 200, 200, true); addC(950, 370); addB(1000, 385, 50);
        addP(1150, 150, 150, 400); exitDoor = { x: 1200, y: 85, w: 45, h: 65 };
    } 
    else if(levelNum === 5) { // The Factory
        addP(20, 400, 120, 200); addL(140, 450, 800, 150); addConv(200, 350, 150, 2.5); addConv(420, 280, 150, -2.0); 
        addP(620, 250, 80, 200); addC(630, 220); addMP(750, 250, 60, 20, 0, 2, 200); addCoin(765, 400); addConv(850, 400, 200, 3.0); 
        addP(1100, 350, 150, 200); exitDoor = { x: 1150, y: 285, w: 45, h: 65 };
    }
    else if(levelNum === 6) { // Trampoline Park
        addP(20, 400, 100, 200); addL(120, 450, 900, 150);
        addB(150, 400, 40); addB(250, 300, 40); addB(350, 200, 40); addB(500, 250, 40); addB(650, 350, 40);
        addP(800, 300, 80, 200); addC(820, 270); addCoin(840, 200); addP(1000, 300, 150, 200); exitDoor = { x: 1050, y: 235, w: 45, h: 65 };
    }
    else if(levelNum === 7) { // Elevator Shaft
        addP(20, 400, 100, 200);
        addMP(150, 350, 60, 20, 0, -2, 250); addMP(250, 100, 60, 20, 0, 2, 250); addMP(350, 350, 60, 20, 0, -2, 250);
        addP(450, 100, 80, 20); addC(460, 70); addL(450, 450, 600, 150);
        addMP(550, 100, 60, 20, 2, 0, 200); addCoin(650, 50); addP(800, 100, 150, 400); exitDoor = { x: 850, y: 35, w: 45, h: 65 };
    }
    else if(levelNum === 8) { // The Treadmill
        addP(20, 400, 80, 200); addConv(100, 400, 800, -3.5); // Massive belt pushing left
        addL(300, 380, 50, 20); addL(500, 380, 50, 20); addL(700, 380, 50, 20); // Lava ON the treadmill
        addP(900, 400, 150, 200); addCoin(950, 300); exitDoor = { x: 950, y: 335, w: 45, h: 65 };
    }
    else if(levelNum === 9) { // Leap of Faith
        checkpoint = { x: 50, y: 50 }; player.x = 50; player.y = 50;
        addP(20, 100, 100, 400); addL(120, 450, 800, 150);
        addB(150, 400, 40); addB(350, 400, 40); addB(550, 400, 40); addB(750, 400, 40);
        addP(900, 100, 150, 400); addCoin(950, 50); exitDoor = { x: 950, y: 35, w: 45, h: 65 };
    }
    else if(levelNum === 10) { // Boiling Ocean
        addP(20, 300, 80, 300); addL(100, 400, 1000, 200);
        addMP(150, 350, 40, 20, 1.5, 0, 150); addMP(350, 250, 40, 20, 0, 2, 100); addMP(450, 350, 40, 20, 2, 1, 100);
        addP(650, 250, 60, 20); addC(660, 220); addCoin(670, 150);
        addMP(750, 250, 40, 20, 2, -1, 150); addP(950, 150, 150, 400); exitDoor = { x: 1000, y: 85, w: 45, h: 65 };
    }
    else if(levelNum === 11) { // Fragile Stairs
        addP(20, 400, 100, 200); addL(120, 450, 800, 150);
        addFP(150, 380, 50); addFP(220, 330, 50); addFP(290, 280, 50); addFP(360, 230, 50); addFP(430, 180, 50);
        addP(520, 150, 80, 400); addC(530, 120); addCoin(550, 50);
        addFP(650, 180, 50); addFP(720, 230, 50); addFP(790, 280, 50);
        addP(880, 330, 150, 250); exitDoor = { x: 930, y: 265, w: 45, h: 65 };
    }
    else if(levelNum === 12) { // Conveyor Chaos
        addP(20, 400, 80, 200); addL(100, 450, 800, 150);
        addConv(150, 350, 100, 4.0); addConv(300, 280, 100, -4.0); addConv(450, 210, 100, 4.0);
        addP(600, 200, 80, 400); addC(610, 170); addCoin(630, 100);
        addConv(750, 300, 150, -5.0); addP(950, 300, 150, 300); exitDoor = { x: 1000, y: 235, w: 45, h: 65 };
    }
    else if(levelNum === 13) { // Ice Skyscraper
        addP(20, 400, 100, 200); addL(120, 450, 800, 150);
        addP(150, 350, 60, 20, true); addP(250, 250, 60, 20, true); addP(150, 150, 60, 20, true);
        addP(350, 100, 80, 20, true); addC(360, 70); addCoin(380, 20);
        addP(500, 150, 60, 20, true); addP(650, 250, 60, 20, true); addP(800, 350, 60, 20, true);
        addP(950, 400, 150, 200); exitDoor = { x: 1000, y: 335, w: 45, h: 65 };
    }
    else if(levelNum === 14) { // The Gauntlet
        addP(20, 400, 80, 200); addL(100, 450, 1100, 150);
        addP(120, 350, 60, 20, true); // Ice
        addConv(220, 300, 100, 3.0); // Conveyor
        addFP(360, 250, 60); // Fragile
        addB(460, 350, 40); // Bounce
        addP(550, 150, 80, 400); addC(560, 120); // Checkpoint
        addMP(680, 150, 60, 20, 0, 3, 200); // Moving
        addCoin(700, 400); 
        addB(750, 400, 40);
        addP(900, 150, 150, 400); exitDoor = { x: 950, y: 85, w: 45, h: 65 };
    }
    else if(levelNum === 15) { // Victory Road
        addP(20, 400, 100, 200);
        for(let i=0; i<10; i++) { addCoin(150 + (i*50), 380 - (i*30)); addP(140 + (i*50), 400 - (i*30), 40, 10); }
        addP(650, 100, 300, 500); exitDoor = { x: 750, y: 35, w: 45, h: 65 };
    }
}

function die() {
    spawnParticles(player.x + 14, player.y + 19, equippedSkin.color, 30, 15);
    deaths++; deathCounterUI.innerText = `☠️ ${deaths}`;
    player.x = checkpoint.x; player.y = checkpoint.y; player.vx = 0; player.vy = 0;
}

function triggerJump() {
    if (player.jumpsLeft > 0 && !isPaused) {
        player.vy = player.jumpForce; player.jumpsLeft--; player.grounded = false;
        player.scaleX = 0.7; player.scaleY = 1.3;
        spawnParticles(player.x + 14, player.y + 38, '#ffffff', 5, 5);
    }
}

window.addEventListener('keydown', (e) => { initAudio(); keys[e.key.toLowerCase()] = true; if (['space', 'w', 'arrowup'].includes(e.key.toLowerCase())) triggerJump(); });
window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
const attachBtn = (id, key) => { const el = document.getElementById(id); if(!el) return; el.addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); keys[key] = true; if(key==='space') triggerJump(); }); el.addEventListener('pointerup', (e) => { e.preventDefault(); keys[key] = false; }); el.addEventListener('pointercancel', (e) => { e.preventDefault(); keys[key] = false; }); };
attachBtn('btn-left', 'arrowleft'); attachBtn('btn-right', 'arrowright'); attachBtn('btn-jump', 'space');

function update() {
    if (isPaused) return;

    if (keys['a'] || keys['arrowleft']) { player.vx -= 1.0; player.facingRight = false; }
    if (keys['d'] || keys['arrowright']) { player.vx += 1.0; player.facingRight = true; }

    player.vy += GRAVITY; 
    player.vx *= player.currentFriction; 
    player.x += player.vx; player.y += player.vy;
    
    player.scaleX += (1 - player.scaleX) * 0.15; player.scaleY += (1 - player.scaleY) * 0.15;
    
    let targetCameraX = player.x - (canvas.width / 3);
    cameraX += (targetCameraX - cameraX) * 0.1;
    if (cameraX < 0) cameraX = 0;

    player.grounded = false;
    player.currentFriction = BASE_FRICTION;

    // Standard & Ice Platforms
    platforms.forEach(p => {
        if (player.x + player.width > p.x && player.x < p.x + p.w) {
            if (player.y + player.height >= p.y && player.y + player.height <= p.y + 25 && player.vy >= 0) {
                player.y = p.y - player.height; player.vy = 0; player.grounded = true; player.jumpsLeft = player.maxJumps;
                if(p.isIce) player.currentFriction = ICE_FRICTION;
            }
        }
    });

    // Conveyor Belts
    conveyors.forEach(c => {
        if (player.x + player.width > c.x && player.x < c.x + c.w) {
            if (player.y + player.height >= c.y && player.y + player.height <= c.y + 25 && player.vy >= 0) {
                player.y = c.y - player.height; player.vy = 0; player.grounded = true; player.jumpsLeft = player.maxJumps;
                player.x += c.speed;
            }
        }
    });

    // Moving Platforms
    movingPlatforms.forEach(mp => {
        mp.x += mp.vx; mp.y += mp.vy;
        mp.traveled += Math.abs(mp.vx) + Math.abs(mp.vy);
        if(mp.traveled >= mp.range) { mp.vx *= -1; mp.vy *= -1; mp.traveled = 0; }
        if (player.x + player.width > mp.x && player.x < mp.x + mp.w && player.y + player.height >= mp.y && player.y + player.height <= mp.y + 25 && player.vy >= 0) {
            player.y = mp.y - player.height; player.vy = 0; player.grounded = true; player.jumpsLeft = player.maxJumps;
            player.x += mp.vx; player.y += mp.vy; 
        }
    });

    // Fragile Platforms
    fragilePlatforms.forEach(fp => {
        if(!fp.active) {
            fp.respawnTimer--;
            if(fp.respawnTimer <= 0) { fp.active = true; fp.timer = 60; spawnParticles(fp.x + fp.w/2, fp.y, currentTheme.platform, 10, 4); }
            return;
        }
        let playerStanding = false;
        if (player.x + player.width > fp.x && player.x < fp.x + fp.w && player.y + player.height >= fp.y && player.y + player.height <= fp.y + 25 && player.vy >= 0) {
            player.y = fp.y - player.height; player.vy = 0; player.grounded = true; player.jumpsLeft = player.maxJumps; playerStanding = true;
        }
        if(playerStanding || fp.timer < 60) {
            fp.timer--;
            if(fp.timer <= 0) { fp.active = false; fp.respawnTimer = 120; spawnParticles(fp.x + fp.w/2, fp.y, '#94a3b8', 15, 5); }
        }
    });

    // Bounce Pads
    bouncePads.forEach(b => {
        if (player.x + player.width > b.x && player.x < b.x + b.w && player.y + player.height >= b.y && player.y + player.height <= b.y + 20 && player.vy >= 0) {
            player.y = b.y - player.height; player.vy = -17; player.jumpsLeft = player.maxJumps; player.scaleX = 0.5; player.scaleY = 1.6;
            spawnParticles(player.x+14, b.y, '#4ade80', 15, 8);
        }
    });

    // Hazards & Death
    const pxCenter = player.x + player.width/2; 
    lavas.forEach(l => { if (pxCenter > l.x && pxCenter < l.x + l.w && player.y + player.height > l.y + 10) die(); });
    if (player.y > canvas.height + 200) die(); 

    // Checkpoints & Collectibles
    checkpointsList.forEach(cp => {
        if (!cp.reached && player.x + player.width > cp.x && player.x < cp.x + cp.w && player.y + player.height > cp.y && player.y < cp.y + cp.h) {
            cp.reached = true; checkpoint = { x: cp.x + 4, y: cp.y + cp.h - player.height - 2 }; spawnParticles(cp.x+10, cp.y, '#22c55e', 20, 6);
        }
    });
    coinsList.forEach(c => {
        if (!c.collected && Math.hypot((player.x + 14) - c.x, (player.y + 19) - c.y) < 25) {
            c.collected = true; coins++; saveProgress(); coinCounterUI.innerText = `🪙 ${coins}`; spawnParticles(c.x, c.y, '#facc15', 15, 6);
        }
    });

    // Exit Door
    if (player.x + player.width > exitDoor.x && player.x < exitDoor.x + exitDoor.w && player.y + player.height > exitDoor.y && player.y < exitDoor.y + exitDoor.h) {
        currentLevel++; if(currentLevel > 15) currentLevel = 1; loadLevel(currentLevel);
    }

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.03; });
    particles = particles.filter(p => p.life > 0);
}

function draw() {
    bgTimer += 0.03;
    let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, currentTheme.sky[0]); skyGrad.addColorStop(0.5, currentTheme.sky[1]); skyGrad.addColorStop(1, currentTheme.sky[2]);
    ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.fillStyle = currentTheme.base; ctx.globalAlpha = 0.3;
    bgScenery.forEach(s => { ctx.fillRect(s.x - (cameraX * s.speed), s.y, s.w, s.h); });
    ctx.restore();

    ctx.save(); ctx.translate(-Math.floor(cameraX), 0);
    
    platforms.forEach(p => {
        ctx.fillStyle = p.isIce ? '#e0f2fe' : currentTheme.platform; ctx.fillRect(p.x, p.y, p.w, 10);
        ctx.fillStyle = p.isIce ? '#7dd3fc' : currentTheme.base; ctx.fillRect(p.x, p.y + 10, p.w, p.h - 10);
    });

    conveyors.forEach(c => {
        ctx.fillStyle = '#64748b'; ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.fillStyle = '#f8fafc'; 
        let offset = (bgTimer * c.speed * 20) % 20;
        for(let i=0; i<c.w; i+=20) {
            let lineX = c.x + i + offset;
            if(lineX > c.x && lineX < c.x + c.w) ctx.fillRect(lineX, c.y, 4, c.h);
        }
    });

    movingPlatforms.forEach(mp => {
        ctx.fillStyle = '#14b8a6'; ctx.fillRect(mp.x, mp.y, mp.w, 8); 
        ctx.fillStyle = '#0f766e'; ctx.fillRect(mp.x, mp.y + 8, mp.w, mp.h - 8);
    });

    fragilePlatforms.forEach(fp => {
        if(fp.active) {
            let shakeX = (fp.timer < 60) ? (Math.random() - 0.5) * 4 : 0;
            ctx.globalAlpha = fp.timer / 60;
            ctx.fillStyle = '#a855f7'; ctx.fillRect(fp.x + shakeX, fp.y, fp.w, 8);
            ctx.fillStyle = '#7e22ce'; ctx.fillRect(fp.x + shakeX, fp.y + 8, fp.w, fp.h - 8);
            ctx.globalAlpha = 1;
        }
    });

    ctx.fillStyle = currentTheme.danger; ctx.shadowBlur = 15; ctx.shadowColor = currentTheme.danger;
    lavas.forEach(l => {
        ctx.beginPath(); ctx.moveTo(l.x, l.y + l.h); ctx.lineTo(l.x, l.y + 5);
        for(let i=0; i<=l.w; i+=20) { ctx.lineTo(l.x + i, l.y + 5 + Math.sin(bgTimer*3 + i*0.1)*5); }
        ctx.lineTo(l.x + l.w, l.y + l.h); ctx.fill();
        ctx.globalAlpha = 0.5; ctx.fillRect(l.x, l.y+15, l.w, l.h-15); ctx.globalAlpha = 1;
    });
    ctx.shadowBlur = 0;

    bouncePads.forEach(b => {
        ctx.fillStyle = '#334155'; ctx.fillRect(b.x, b.y+5, b.w, b.h-5);
        ctx.fillStyle = '#4ade80'; ctx.fillRect(b.x, b.y + Math.sin(bgTimer*8)*2, b.w, 5); 
    });

    checkpointsList.forEach(cp => {
        ctx.fillStyle = '#64748b'; ctx.fillRect(cp.x, cp.y, 4, cp.h);
        ctx.fillStyle = cp.reached ? '#22c55e' : '#cbd5e1';
        ctx.beginPath(); ctx.moveTo(cp.x + 4, cp.y); ctx.lineTo(cp.x + 20, cp.y + 5); ctx.lineTo(cp.x + 4, cp.y + 12); ctx.fill();
    });

    ctx.shadowBlur = 15; ctx.shadowColor = '#fde047'; ctx.fillStyle = '#facc15';
    coinsList.forEach(c => { if (!c.collected) { ctx.beginPath(); ctx.arc(c.x, c.y + Math.sin(bgTimer*5)*4, 8, 0, Math.PI * 2); ctx.fill(); } });
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#f59e0b'; ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
    
    particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;

    drawAdvancedCharacter(ctx, player.x + 14, player.y + 38, equippedSkin, player.facingRight, player.scaleX, player.scaleY);
    ctx.restore();
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

loadProgress(); coinCounterUI.innerText = `🪙 ${coins}`; loadLevel(currentLevel); gameLoop();

</script>
</body>
