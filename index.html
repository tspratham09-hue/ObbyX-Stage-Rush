<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometric Obby</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top UI Bar -->
    <div id="ui-bar">
        <div class="ui-group">
            <span id="level-title">Stage 1 / 15</span>
            <span id="theme-name" class="sub-text">Theme: Gray Blocks</span>
        </div>
        <div class="ui-group center-text">
            <span id="timer-display">⏱️ 00:00</span>
        </div>
        <div class="ui-group right-text">
            <span id="coin-counter">🪙 0</span>
            <span id="death-counter">☠️ 0</span>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Modal -->
        <div id="start-modal" class="modal">
            <div class="modal-content">
                <h1>GEOMETRIC OBBY</h1>
                <p>Use W/A/S/D or Arrow Keys to move.</p>
                <p>Press 'S' for Shop | 'L' for Levels | 'ESC' to Pause</p>
                <button id="start-game-btn" class="action-btn">PLAY NOW</button>
            </div>
        </div>

        <!-- Pause Modal -->
        <div id="pause-modal" class="modal hidden">
            <div class="modal-content">
                <h2>PAUSED</h2>
                <button id="resume-btn" class="action-btn">RESUME</button>
            </div>
        </div>

        <!-- Shop Modal -->
        <div id="shop-modal" class="modal hidden">
            <div class="modal-content shop-content">
                <h2>SKIN SHOP</h2>
                <div id="shop-items"></div>
                <button id="close-shop-btn" class="close-btn">CLOSE</button>
            </div>
        </div>

        <!-- Level Modal -->
        <div id="level-modal" class="modal hidden">
            <div class="modal-content">
                <h2>STAGE SELECT</h2>
                <div id="level-grid"></div>
                <button id="close-level-btn" class="close-btn">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- Mobile Controls (Only visible on small screens) -->
    <div id="mobile-controls">
        <div class="control-cluster left-cluster">
            <button id="btn-left" class="mobile-btn">◀</button>
            <button id="btn-right" class="mobile-btn">▶</button>
        </div>
        <div class="control-cluster right-cluster">
            <button id="btn-jump" class="mobile-btn">▲</button>
        </div>
    </div>

    <!-- Load Game Script with Cache Buster -->
    <script src="game.js?v=300"></script>
</body>
</html>
