<div id="game-container">

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 960; canvas.height = 540;

const levelTitleUI = document.getElementById('level-title');
const coinCounterUI = document.getElementById('coin-counter');
const deathCounterUI = document.getElementById('death-counter');
const themeNameUI = document.getElementById('theme-name');
const timerDisplayUI = document.getElementById('timer-display');
const shopModal = document.getElementById('shop-modal');
const victoryModal = document.getElementById('victory-modal');
const openShopBtn = document.getElementById('open-shop-btn');
const closeShopBtn = document.getElementById('close-shop-btn');
const restartGameBtn = document.getElementById('restart-game-btn');
const shopItemsContainer = document.getElementById('shop-items');
const finalStatsUI = document.getElementById('final-stats');

// --- WEB AUDIO SYNTHESIZER ---
let audioCtx = null;
function initAudio() { 
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
    if (audioCtx.state === 'suspended') audioCtx.resume(); 
}

function playJumpSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'square';
    let t = audioCtx.currentTime;
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(420, t + 0.12);
    gain.gain.setValueAtTime(0.08, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
    osc.start(t); osc.stop(t + 0.12);
}

function playCoinSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    let t = audioCtx.currentTime;
    osc.frequency.setValueAtTime(987.77, t); 
    osc.frequency.setValueAtTime(1318.51, t + 0.08); 
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.22);
    osc.start(t); osc.stop(t + 0.22);
}

function playBounceSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    let t = audioCtx.currentTime;
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(550, t + 0.08);
    osc.frequency.exponentialRampToValueAtTime(220, t + 0.2);
    gain.gain.setValueAtTime(0.18, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
    osc.start(t); osc.stop(t + 0.2);
}

function playCheckpointSound() {
    if (!audioCtx) return;
    let notes = [523.25, 659.25, 783.99]; 
    notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        let t = audioCtx.currentTime + idx * 0.07;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
        osc.start(t); osc.stop(t + 0.18);
    });
}

function playDeathSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    let t = audioCtx.currentTime;
    osc.frequency.setValueAtTime(260, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
    osc.start(t); osc.stop(t + 0.25);
}

function playStageClearSound() {
    if (!audioCtx) return;
    let notes = [523.25, 659.25, 783.99, 1046.50]; 
    notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        let t = audioCtx.currentTime + idx * 0.08;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.28);
        osc.start(t); osc.stop(t + 0.28);
    });
}

];

let coins = 0; let currentLevel = 1; let deaths = 0; let isPaused = false;
let gameStartTime = Date.now();

const ICE_FRICTION = 0.97; 

let checkpoint = { x: 50, y: 350 };
let keys = {};
let platforms = []; let lavas = []; let bouncePads = []; let coinsList = []; let checkpointsList = []; let particles = []; 
let movingPlatforms = []; let fragilePlatforms = []; let conveyors = [];
let ambientParticles = [];

    { id: 'ice', name: "4. Slippery Slopes", sky: ["#082f49", "#0c4a6e", "#0284c7"], platform: "#bae6fd", base: "#38bdf8", danger: "#0f172a", weather: 'snow' },
    { id: 'cyber', name: "5. The Factory", sky: ["#2e1065", "#4c1d95", "#3b0764"], platform: "#94a3b8", base: "#475569", danger: "#d946ef", weather: 'cyber' },

    { id: 'elevator', name: "7. Elevator Shaft", sky: ["#171717", "#262626", "#404040"], platform: "#fbbf24", base: "#d97706", danger: "#ef4444", weather: 'cyber' },
    { id: 'treadmill', name: "8. The Treadmill", sky: ["#1e3a8a", "#1e40af", "#1d4ed8"], platform: "#64748b", base: "#475569", danger: "#f97316", weather: 'embers' },
    { id: 'faith', name: "9. Leap of Faith", sky: ["#020617", "#0f172a", "#1e293b"], platform: "#34d399", base: "#059669", danger: "#dc2626", weather: 'stars' },
    { id: 'ocean', name: "10. Boiling Ocean", sky: ["#450a0a", "#7f1d1d", "#991b1b"], platform: "#38bdf8", base: "#0284c7", danger: "#f97316", weather: 'embers' },
    { id: 'stairs', name: "11. Fragile Stairs", sky: ["#14532d", "#166534", "#15803d"], platform: "#a3e635", base: "#65a30d", danger: "#dc2626", weather: 'spores' },
    { id: 'chaos', name: "12. Conveyor Chaos", sky: ["#312e81", "#3730a3", "#4338ca"], platform: "#c084fc", base: "#9333ea", danger: "#f97316", weather: 'cyber' },
    { id: 'icesky', name: "13. Ice Skyscraper", sky: ["#0c4a6e", "#0369a1", "#0284c7"], platform: "#f0f9ff", base: "#7dd3fc", danger: "#0284c7", weather: 'snow' },
    { id: 'gauntlet', name: "14. The Gauntlet", sky: ["#18181b", "#27272a", "#3f3f46"], platform: "#f87171", base: "#dc2626", danger: "#b91c1c", weather: 'embers' },
    { id: 'victory', name: "15. Victory Road", sky: ["#422006", "#713f12", "#a16207"], platform: "#fef08a", base: "#eab308", danger: "#ffffff", weather: 'confetti' }
];
let currentTheme = THEMES[0];

function loadProgress() {
    coins = parseInt(localStorage.getItem('obby_coins') || '0');
    unlockedSkins = JSON.parse(localStorage.getItem('obby_skins') || '["king"]');
    equippedSkin = SKINS.find(s => s.id === (localStorage.getItem('obby_equippedSkin') || 'king')) || SKINS[0];
}
function saveProgress() {
    localStorage.setItem('obby_coins', coins.toString());
    localStorage.setItem('obby_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('obby_equippedSkin', equippedSkin.id);
}

function drawAdvancedCharacter(context, x, y, skin, facingRight, scaleX, scaleY) {
    context.save();
    context.translate(x, y); context.scale(facingRight ? scaleX : -scaleX, scaleY);
    context.fillStyle = skin.color; context.fillRect(-8, -36, 16, 12); context.fillRect(-13, -24, 26, 9); context.fillRect(-7, -15, 14, 15);
    context.fillStyle = skin.dark; context.fillRect(4, -36, 4, 12); context.fillRect(8, -24, 5, 9);
    context.fillStyle = '#000000'; context.fillRect(-4, -32, 3, 3); context.fillRect(2, -32, 3, 3);
    context.fillStyle = skin.color; context.fillRect(-10, -40, 20, 5);
    context.restore();
}

openShopBtn.onclick = () => { initAudio(); isPaused = true; shopModal.classList.remove('hidden'); renderShop(); };
closeShopBtn.onclick = () => { initAudio(); isPaused = false; shopModal.classList.add('hidden'); };
restartGameBtn.onclick = () => { initAudio(); victoryModal.classList.add('hidden'); currentLevel = 1; deaths = 0; gameStartTime = Date.now(); loadLevel(1); isPaused = false; };

function renderShop() {
    shopItemsContainer.innerHTML = '';
    SKINS.forEach(skin => {
        const isUnlocked = unlockedSkins.includes(skin.id);
        const isEquipped = equippedSkin.id === skin.id;
        const card = document.createElement('div');
        card.className = `shop-card ${isEquipped ? 'selected' : ''}`;
        card.innerHTML = `<h4>${skin.name}</h4><canvas id="preview-${skin.id}" width="60" height="60" style="margin: 0 auto; display: block;"></canvas><p>${isUnlocked ? 'Owned' : '🪙 ' + skin.cost}</p><button ${isEquipped ? 'disabled' : ''}>${isEquipped ? 'Equipped' : isUnlocked ? 'Equip' : 'Buy'}</button>`;
        card.querySelector('button').onclick = () => {
            initAudio();
            if (isUnlocked) { equippedSkin = skin; playCoinSound(); }
            else if (coins >= skin.cost) { coins -= skin.cost; unlockedSkins.push(skin.id); equippedSkin = skin; playCoinSound(); }
            saveProgress(); renderShop();
        };
        shopItemsContainer.appendChild(card);
    });
    SKINS.forEach(skin => { const ctx = document.getElementById(`preview-${skin.id}`)?.getContext('2d'); if(ctx) drawAdvancedCharacter(ctx, 30, 50, skin, true, 1.1, 1.1); });
    coinCounterUI.innerText = `🪙 ${coins}`;
}

function spawnParticles(x, y, color, count, speed) {
    for(let i=0; i<count; i++) particles.push({ x, y, vx: (Math.random()-0.5)*speed, vy: (Math.random()-0.5)*speed - 2, life: 1, color, size: Math.random()*4 + 2 });
}

function initAmbientParticles() {
    ambientParticles = [];
    for(let i=0; i<40; i++) {
        ambientParticles.push({
            x: Math.random() * canvas.width * 2,
            y: Math.random() * canvas.height,
            size: Math.random() * 3 + 1,
            speedX: (Math.random() - 0.5) * 1.5,
            speedY: Math.random() * 1.5 - 2,
            alpha: Math.random() * 0.7 + 0.3
        });
    }
}

function generateBackgroundScenery() {
    bgScenery = [];
    for(let i = 0; i < 15; i++) {
        bgScenery.push({ x: Math.random() * 3000, y: canvas.height - (Math.random() * 180 + 100), w: Math.random() * 140 + 80, h: Math.random() * 250 + 150, speed: Math.random() * 0.25 + 0.1 });
    }
}

function loadLevel(levelNum) {
    platforms = []; lavas = []; bouncePads = []; coinsList = []; checkpointsList = []; particles = []; movingPlatforms = []; fragilePlatforms = []; conveyors = [];
    cameraX = 0; bgTimer = 0;
    
    currentTheme = THEMES[(levelNum - 1) % THEMES.length];
    levelTitleUI.innerText = `Stage ${levelNum} / 15`;
    themeNameUI.innerText = `${currentTheme.name}`;
    generateBackgroundScenery();
    initAmbientParticles();

    const addP = (x, y, w, h, isIce=false) => platforms.push({ x, y, w, h, isIce });
    const addL = (x, y, w, h) => lavas.push({ x, y, w, h });
    const addB = (x, y, w) => bouncePads.push({ x, y, w, h: 15 });
    const addC = (x, y) => checkpointsList.push({ x, y, w: 20, h: 30, reached: false });
    const addCoin = (x, y) => coinsList.push({ x, y, collected: false });
    const addMP = (x, y, w, h, vx, vy, range) => movingPlatforms.push({ x, y, w, h, vx, vy, range, traveled: 0 });
    const addFP = (x, y, w) => fragilePlatforms.push({ x, y, w, h: 15, active: true, timer: 60, respawnTimer: 0 });
    const addConv = (x, y, w, speed) => conveyors.push({ x, y, w, h: 15, speed });

    if(levelNum === 1) { 
        addP(20, 400, 160, 200); addP(260, 400, 140, 200); addP(480, 400, 100, 200); addB(510, 385, 40); 
        addP(680, 260, 100, 300); addC(700, 230); addCoin(720, 180); addP(880, 260, 150, 300); exitDoor = { x: 930, y: 195, w: 45, h: 65 };
    } 
    else if(levelNum === 2) { 
        addP(20, 400, 120, 200); addL(140, 450, 700, 150); addP(180, 380, 70, 20); addP(300, 340, 70, 20); addP(420, 300, 70, 20); 
        addP(540, 300, 100, 200); addC(560, 270); addP(690, 280, 70, 20); addCoin(710, 230);
        addP(820, 260, 150, 300); exitDoor = { x: 870, y: 195, w: 45, h: 65 };
    } 
    else if(levelNum === 3) { 
        addP(20, 400, 120, 200); addL(140, 450, 700, 150); addFP(180, 380, 60); addFP(280, 340, 60); addFP(380, 300, 60); 
        addP(490, 280, 90, 300); addC(510, 250); addMP(630, 270, 70, 20, 1.2, 0, 120); addCoin(800, 180);
        addP(840, 250, 150, 300); exitDoor = { x: 890, y: 185, w: 45, h: 65 };
    } 
    else if(levelNum === 4) { 
        addP(20, 400, 120, 200); addP(180, 380, 140, 200, true); addP(370, 340, 140, 200, true); addL(510, 450, 300, 150); 
        addP(560, 300, 80, 20, true); addCoin(590, 250); addP(690, 280, 140, 200, true); addC(720, 250); addB(790, 265, 40);
        addP(900, 160, 150, 400); exitDoor = { x: 950, y: 95, w: 45, h: 65 };
    } 
    else if(levelNum === 5) { 
        addP(20, 400, 120, 200); addL(140, 450, 700, 150); addConv(180, 360, 140, 2.0); addConv(360, 300, 140, -2.0); 
        addP(540, 270, 90, 300); addC(560, 240); addMP(670, 270, 60, 20, 0, 1.5, 100); addCoin(685, 150); addConv(780, 240, 140, 2.5); 
        addP(960, 240, 150, 300); exitDoor = { x: 1010, y: 175, w: 45, h: 65 };
    }
    else if(levelNum === 6) { 
        addP(20, 400, 100, 200); addL(120, 450, 800, 150);
        addB(160, 410, 45); addB(270, 350, 45); addB(380, 290, 45); addB(500, 320, 45); 
        addP(620, 280, 90, 250); addC(640, 250); addCoin(660, 200); addB(750, 280, 45);
        addP(870, 220, 150, 300); exitDoor = { x: 920, y: 155, w: 45, h: 65 };

        addP(400, 220, 80, 20); addC(420, 190);

        addP(20, 420, 100, 200); addL(120, 450, 800, 150);
        addP(150, 360, 60, 20, true); addP(250, 300, 60, 20, true); addP(170, 230, 60, 20, true);
        addP(280, 180, 80, 20, true); addC(290, 150); addCoin(310, 100);
        addP(410, 180, 60, 20, true); addP(530, 220, 60, 20, true); addP(650, 260, 60, 20, true);

        addP(120, 360, 60, 20, true);
        addConv(210, 320, 90, 2.5);
        addFP(330, 280, 60);
        addB(420, 350, 40);
        addP(510, 240, 80, 300); addC(520, 210);

        addP(20, 400, 100, 200);
        for(let i=0; i<8; i++) { addCoin(160 + (i*60), 360 - (i*25)); addP(140 + (i*60), 380 - (i*25), 45, 12); }

    }

    if (platforms.length > 0) {
        checkpoint = { x: platforms[0].x + 20, y: platforms[0].y - player.height - 2 };
    } else {
        checkpoint = { x: 50, y: 300 };
    }
    player.x = checkpoint.x; player.y = checkpoint.y; player.vx = 0; player.vy = 0;
}

function die() {
    playDeathSound();
    spawnParticles(player.x + 13, player.y + 18, equippedSkin.color, 30, 15);
    deaths++; deathCounterUI.innerText = `☠️ ${deaths}`;
    player.x = checkpoint.x; player.y = checkpoint.y; player.vx = 0; player.vy = 0;
}

function triggerJump() {
    initAudio();
    if (player.jumpsLeft > 0 && !isPaused) {
        playJumpSound();
        player.vy = player.jumpForce; player.jumpsLeft--; player.grounded = false;
        player.scaleX = 0.7; player.scaleY = 1.3;
        spawnParticles(player.x + 13, player.y + 36, '#ffffff', 5, 5);
    }
}

window.addEventListener('keydown', (e) => { initAudio(); keys[e.key.toLowerCase()] = true; if (['space', 'w', 'arrowup'].includes(e.key.toLowerCase())) triggerJump(); });
window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);
const attachBtn = (id, key) => { 
    const el = document.getElementById(id); 
    if(!el) return; 
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); keys[key] = true; if(key==='space') triggerJump(); }); 
    el.addEventListener('pointerup', (e) => { e.preventDefault(); keys[key] = false; }); 
    el.addEventListener('pointercancel', (e) => { e.preventDefault(); keys[key] = false; }); 
};
attachBtn('btn-left', 'arrowleft'); attachBtn('btn-right', 'arrowright'); attachBtn('btn-jump', 'space');

function updateTimer() {
    let elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
    let m = Math.floor(elapsed / 60).toString().padStart(2, '0');
    let s = (elapsed % 60).toString().padStart(2, '0');
    timerDisplayUI.innerText = `⏱️ ${m}:${s}`;
}

function update() {
    if (isPaused) return;

    updateTimer();

    if (keys['a'] || keys['arrowleft']) { player.vx -= 0.95; player.facingRight = false; }
    if (keys['d'] || keys['arrowright']) { player.vx += 0.95; player.facingRight = true; }

    let prevY = player.y;
    player.vy += GRAVITY; 
    player.vx *= player.currentFriction; 
    player.x += player.vx; player.y += player.vy;
    
    player.scaleX += (1 - player.scaleX) * 0.15; player.scaleY += (1 - player.scaleY) * 0.15;
    
    let targetCameraX = player.x - (canvas.width / 3);
    cameraX += (targetCameraX - cameraX) * 0.1;
    if (cameraX < 0) cameraX = 0;

    player.grounded = false;
    player.currentFriction = BASE_FRICTION;

    // Platforms
    platforms.forEach(p => {
        if (player.x + player.width > p.x && player.x < p.x + p.w) {
            let prevBottom = prevY + player.height;
            let currentBottom = player.y + player.height;
            if (prevBottom <= p.y + 12 && currentBottom >= p.y && player.vy >= 0) {
                player.y = p.y - player.height; player.vy = 0; player.grounded = true; player.jumpsLeft = player.maxJumps;
                if(p.isIce) player.currentFriction = ICE_FRICTION;
            }
        }
    });

    // Conveyors
    conveyors.forEach(c => {
        if (player.x + player.width > c.x && player.x < c.x + c.w) {
            let prevBottom = prevY + player.height;
            let currentBottom = player.y + player.height;
            if (prevBottom <= c.y + 12 && currentBottom >= c.y && player.vy >= 0) {
                player.y = c.y - player.height; player.vy = 0; player.grounded = true; player.jumpsLeft = player.maxJumps;
                player.x += c.speed;
            }
        }
    });

    // Moving Platforms
    movingPlatforms.forEach(mp => {
        mp.x += mp.vx; mp.y += mp.vy;
        mp.traveled += Math.abs(mp.vx) + Math.abs(mp.vy);
        if(mp.traveled >= mp.range) { mp.vx *= -1; mp.vy *= -1; mp.traveled = 0; }
        if (player.x + player.width > mp.x && player.x < mp.x + mp.w) {
            let prevBottom = prevY + player.height;
            let currentBottom = player.y + player.height;
            if (prevBottom <= mp.y + 14 && currentBottom >= mp.y && player.vy >= 0) {
                player.y = mp.y - player.height; player.vy = 0; player.grounded = true; player.jumpsLeft = player.maxJumps;
                player.x += mp.vx; player.y += mp.vy; 
            }
        }
    });

    // Fragile Platforms
    fragilePlatforms.forEach(fp => {
        if(!fp.active) {
            fp.respawnTimer--;
            if(fp.respawnTimer <= 0) { fp.active = true; fp.timer = 60; spawnParticles(fp.x + fp.w/2, fp.y, currentTheme.platform, 10, 4); }
            return;
        }
        let playerStanding = false;
        if (player.x + player.width > fp.x && player.x < fp.x + fp.w) {
            let prevBottom = prevY + player.height;
            let currentBottom = player.y + player.height;
            if (prevBottom <= fp.y + 12 && currentBottom >= fp.y && player.vy >= 0) {
                player.y = fp.y - player.height; player.vy = 0; player.grounded = true; player.jumpsLeft = player.maxJumps; playerStanding = true;
            }
        }
        if(playerStanding || fp.timer < 60) {
            fp.timer--;
            if(fp.timer <= 0) { fp.active = false; fp.respawnTimer = 120; spawnParticles(fp.x + fp.w/2, fp.y, '#94a3b8', 15, 5); }
        }
    });

    // Bounce Pads
    bouncePads.forEach(b => {
        if (player.x + player.width > b.x && player.x < b.x + b.w && player.y + player.height >= b.y && player.y + player.height <= b.y + 20 && player.vy >= 0) {
            playBounceSound();
            player.y = b.y - player.height; player.vy = -16.5; player.jumpsLeft = player.maxJumps; player.scaleX = 0.5; player.scaleY = 1.6;
            spawnParticles(player.x+13, b.y, '#4ade80', 15, 8);
        }
    });

    // Hazards
    const pxCenter = player.x + player.width/2; 
    lavas.forEach(l => { if (pxCenter > l.x && pxCenter < l.x + l.w && player.y + player.height > l.y + 8) die(); });
    if (player.y > canvas.height + 150) die(); 

    // Checkpoints & Collectibles
    checkpointsList.forEach(cp => {
        if (!cp.reached && player.x + player.width > cp.x && player.x < cp.x + cp.w && player.y + player.height > cp.y && player.y < cp.y + cp.h) {
            playCheckpointSound();
            cp.reached = true; checkpoint = { x: cp.x + 4, y: cp.y + cp.h - player.height - 2 }; spawnParticles(cp.x+10, cp.y, '#22c55e', 20, 6);
        }
    });
    coinsList.forEach(c => {
        if (!c.collected && Math.hypot((player.x + 13) - c.x, (player.y + 18) - c.y) < 24) {
            playCoinSound();
            c.collected = true; coins++; saveProgress(); coinCounterUI.innerText = `🪙 ${coins}`; spawnParticles(c.x, c.y, '#facc15', 15, 6);
        }
    });

    // Exit Door
    if (player.x + player.width > exitDoor.x && player.x < exitDoor.x + exitDoor.w && player.y + player.height > exitDoor.y && player.y < exitDoor.y + exitDoor.h) {
        playStageClearSound();
        if(currentLevel === 15) {
            isPaused = true;
            finalStatsUI.innerText = `Time: ${timerDisplayUI.innerText.replace('⏱️ ', '')} | Total Deaths: ${deaths}`;
            victoryModal.classList.remove('hidden');
        } else {
            currentLevel++; loadLevel(currentLevel);
        }
    }

    // Particle Updates
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.03; });
    particles = particles.filter(p => p.life > 0);

    ambientParticles.forEach(p => {
        p.x += p.speedX; p.y += p.speedY;
        if(p.y < 0) p.y = canvas.height;
        if(p.y > canvas.height) p.y = 0;
        if(p.x < 0) p.x = canvas.width * 2;
        if(p.x > canvas.width * 2) p.x = 0;
    });
}

function draw() {
    bgTimer += 0.03;
    let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, currentTheme.sky[0]); skyGrad.addColorStop(0.5, currentTheme.sky[1]); skyGrad.addColorStop(1, currentTheme.sky[2]);
    ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.fillStyle = currentTheme.base; ctx.globalAlpha = 0.25;
    bgScenery.forEach(s => { ctx.fillRect(s.x - (cameraX * s.speed), s.y, s.w, s.h); });
    ctx.restore();

    ctx.save();
    ambientParticles.forEach(p => {
        ctx.fillStyle = currentTheme.weather === 'embers' ? '#f97316' : currentTheme.weather === 'snow' ? '#ffffff' : currentTheme.weather === 'spores' ? '#84cc16' : '#38bdf8';
        ctx.globalAlpha = p.alpha; ctx.beginPath(); ctx.arc(p.x - (cameraX * 0.5), p.y, p.size, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();

    ctx.save(); ctx.translate(-Math.floor(cameraX), 0);
    
    platforms.forEach(p => {
        ctx.fillStyle = p.isIce ? '#e0f2fe' : currentTheme.platform; ctx.fillRect(p.x, p.y, p.w, 8);
        ctx.fillStyle = p.isIce ? '#7dd3fc' : currentTheme.base; ctx.fillRect(p.x, p.y + 8, p.w, p.h - 8);
    });

    conveyors.forEach(c => {
        ctx.fillStyle = '#475569'; ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.fillStyle = '#38bdf8'; 
        let offset = (bgTimer * c.speed * 18) % 18;
        for(let i=-20; i<c.w+20; i+=18) {
            let lineX = c.x + i + offset;
            if(lineX > c.x && lineX < c.x + c.w) ctx.fillRect(lineX, c.y, 4, c.h);
        }
    });

    movingPlatforms.forEach(mp => {
        ctx.fillStyle = '#14b8a6'; ctx.fillRect(mp.x, mp.y, mp.w, 6); 
        ctx.fillStyle = '#0f766e'; ctx.fillRect(mp.x, mp.y + 6, mp.w, mp.h - 6);
    });

    fragilePlatforms.forEach(fp => {
        if(fp.active) {
            let shakeX = (fp.timer < 60) ? (Math.random() - 0.5) * 4 : 0;
            ctx.globalAlpha = fp.timer / 60;
            ctx.fillStyle = '#c084fc'; ctx.fillRect(fp.x + shakeX, fp.y, fp.w, 6);
            ctx.fillStyle = '#7e22ce'; ctx.fillRect(fp.x + shakeX, fp.y + 6, fp.w, fp.h - 6);
            ctx.globalAlpha = 1;
        }
    });

    ctx.fillStyle = currentTheme.danger; ctx.shadowBlur = 12; ctx.shadowColor = currentTheme.danger;
    lavas.forEach(l => {
        ctx.beginPath(); ctx.moveTo(l.x, l.y + l.h); ctx.lineTo(l.x, l.y + 4);
        for(let i=0; i<=l.w; i+=15) { ctx.lineTo(l.x + i, l.y + 4 + Math.sin(bgTimer*4 + i*0.12)*4); }
        ctx.lineTo(l.x + l.w, l.y + l.h); ctx.fill();
        ctx.globalAlpha = 0.4; ctx.fillRect(l.x, l.y+12, l.w, l.h-12); ctx.globalAlpha = 1;
    });
    ctx.shadowBlur = 0;

    bouncePads.forEach(b => {
        ctx.fillStyle = '#334155'; ctx.fillRect(b.x, b.y+4, b.w, b.h-4);
        ctx.fillStyle = '#4ade80'; ctx.fillRect(b.x, b.y + Math.sin(bgTimer*8)*2, b.w, 5); 
    });

    checkpointsList.forEach(cp => {
        ctx.fillStyle = '#94a3b8'; ctx.fillRect(cp.x, cp.y, 4, cp.h);
        ctx.fillStyle = cp.reached ? '#22c55e' : '#f87171';
        ctx.beginPath(); ctx.moveTo(cp.x + 4, cp.y); 
        ctx.lineTo(cp.x + 20 + Math.sin(bgTimer*5)*3, cp.y + 5); 
        ctx.lineTo(cp.x + 4, cp.y + 12); ctx.fill();
    });

    ctx.shadowBlur = 12; ctx.shadowColor = '#fde047'; ctx.fillStyle = '#facc15';
    coinsList.forEach(c => { if (!c.collected) { ctx.beginPath(); ctx.arc(c.x, c.y + Math.sin(bgTimer*5)*3, 7, 0, Math.PI * 2); ctx.fill(); } });
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#f59e0b'; ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
    ctx.fillStyle = '#fbbf24'; ctx.fillRect(exitDoor.x + 5, exitDoor.y + 5, exitDoor.w - 10, exitDoor.h - 5);
    
    particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;

    drawAdvancedCharacter(ctx, player.x + 13, player.y + 36, equippedSkin, player.facingRight, player.scaleX, player.scaleY);
    ctx.restore();
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

loadProgress(); coinCounterUI.innerText = `🪙 ${coins}`; loadLevel(currentLevel); gameLoop();
</script>
